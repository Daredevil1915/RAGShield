# Fully hosted: Ollama Cloud chat and OpenAI-compatible embedding API.
services:
  - type: web
    name: ragshield
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-app.txt && python -c "import tiktoken; tiktoken.get_encoding('cl100k_base')"
    startCommand: python scripts/start_render.py
    healthCheckPath: /_stcore/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: TIKTOKEN_CACHE_DIR
        value: /opt/render/project/src/.cache/tiktoken
      - key: APP_DB_DIR
        value: /opt/render/project/src/data/app_chroma
      - key: APP_RESEARCH_DEMO
        value: '1'
      - key: MODEL_PROVIDER
        value: ollama_cloud
      - key: EMBEDDING_PROVIDER
        value: openai
      - key: OLLAMA_API_KEY
        sync: false
      - key: OLLAMA_CLOUD_MODEL
        value: gemma4:31b
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_EMBED_MODEL
        value: text-embedding-3-small
      - key: DEMO_PASSWORD
        generateValue: true
