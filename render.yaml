# Public portfolio: no-key retrieval on Render, Ollama Cloud for generation.
services:
  - type: web
    name: ragshield
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-app.txt && python -c "import tiktoken; tiktoken.get_encoding('cl100k_base')"
    startCommand: python scripts/start_render.py
    healthCheckPath: /_stcore/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: TIKTOKEN_CACHE_DIR
        value: /opt/render/project/src/.cache/tiktoken
      - key: APP_DB_DIR
        value: /opt/render/project/src/data/app_chroma
      - key: APP_RESEARCH_DEMO
        value: '1'
      - key: APP_PUBLIC_DEMO
        value: '1'
      - key: MODEL_PROVIDER
        value: ollama_cloud
      - key: EMBEDDING_PROVIDER
        value: hashing
      - key: APP_MIN_RELEVANCE
        value: '0.08'
      - key: OLLAMA_API_KEY
        sync: false
      - key: OLLAMA_CLOUD_MODEL
        value: gemma4:31b
